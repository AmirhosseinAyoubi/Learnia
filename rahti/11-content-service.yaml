# Build image: docker build python-services/content-service/ -t <registry>/learnia/content-service:latest
# Push to Rahti internal registry, then update 'image' below.
# Note: No external Route — content-service is internal only (called by ai-service and processing-service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  namespace: learnia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: content-service
  template:
    metadata:
      labels:
        app: content-service
    spec:
      containers:
        - name: content-service
          image: image-registry.openshift-image-registry.svc:5000/learnia/content-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: learnia-config
                  key: CONTENT_DATABASE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: learnia-config
                  key: AUTH_SERVICE_URL
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 250m
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: content-service
  namespace: learnia
spec:
  selector:
    app: content-service
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: content-service
  namespace: learnia
spec:
  to:
    kind: Service
    name: content-service
  port:
    targetPort: 8002
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
