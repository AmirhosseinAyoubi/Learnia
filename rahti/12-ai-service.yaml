# Build image: docker build python-services/ai-service/ -t <registry>/learnia/ai-service:latest
# Push to Rahti internal registry, then update 'image' below.
#
# Prerequisites:
#   oc create secret generic learnia-openai-secret \
#     --from-literal=api_key=<YOUR_OPENAI_API_KEY>
#   oc create secret generic learnia-internal-secret \
#     --from-literal=api_key=<INTERNAL_SERVICE_API_KEY>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: learnia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: image-registry.openshift-image-registry.svc:5000/learnia/ai-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: learnia-openai-secret
                  key: api_key
            - name: CONTENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: learnia-config
                  key: CONTENT_SERVICE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: learnia-config
                  key: AUTH_SERVICE_URL
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 250m
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: learnia
spec:
  selector:
    app: ai-service
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-service
  namespace: learnia
spec:
  to:
    kind: Service
    name: ai-service
  port:
    targetPort: 8003
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
